<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文生圖提示詞</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#fff7ed', 100:'#ffedd5', 500:'#f97316', 600:'#ea580c', 700:'#c2410c' }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: "Noto Sans TC", "Plus Jakarta Sans", sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
  <div class="max-w-3xl mx-auto px-4 py-8 sm:py-16">
    <header class="mb-10 text-center sm:text-left">
      <p class="text-xs font-bold tracking-widest text-brand-600 uppercase mb-2">Image prompts</p>
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900">文生圖提示詞</h1>
      <p class="mt-2 text-sm text-slate-500">請選擇要複製的提示詞頁面。</p>
    </header>

    <nav class="grid gap-4 sm:grid-cols-2" aria-label="提示詞分類">
      <a href="story.html" class="group bg-white border border-slate-200 hover:border-brand-500 rounded-2xl shadow-sm hover:shadow-md p-5 sm:p-6 transition-all no-underline text-inherit">
        <div class="w-11 h-11 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center mb-4 group-hover:bg-brand-600 group-hover:text-white transition-colors">
          <i class="fa-solid fa-book-open" aria-hidden="true"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-900">童話故事</h2>
        <p class="mt-1.5 text-sm text-slate-500 leading-relaxed">北風和太陽：四格繪本文字與縮短提示詞，可各自獨立複製。</p>
        <p class="mt-4 text-sm font-semibold text-brand-700 group-hover:text-brand-600">
          打開頁面 <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
        </p>
      </a>

      <a href="cards.html" class="group bg-white border border-slate-200 hover:border-brand-500 rounded-2xl shadow-sm hover:shadow-md p-5 sm:p-6 transition-all no-underline text-inherit">
        <div class="w-11 h-11 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center mb-4 group-hover:bg-brand-600 group-hover:text-white transition-colors">
          <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-900">遊戲卡牌</h2>
        <p class="mt-1.5 text-sm text-slate-500 leading-relaxed">先複製風格和版面，再接上角色外觀，一齊貼入 Canva。</p>
        <p class="mt-4 text-sm font-semibold text-brand-700 group-hover:text-brand-600">
          打開頁面 <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
        </p>
      </a>
    </nav>
  </div>
</body>
</html>
